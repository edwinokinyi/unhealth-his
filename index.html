<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniHealth HIS</title><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182337}header{background:#0b1220;color:white;padding:16px 22px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e0e7f0;border-radius:12px;padding:18px;margin-bottom:16px}.metric{font-size:28px;font-weight:800}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#1db890;color:white;font-weight:700}button.alt{background:#e9eef5;color:#24334a}input,select,textarea{width:100%;padding:10px;border:1px solid #d4deeb;border-radius:8px;box-sizing:border-box}label{font-size:12px;font-weight:700;color:#66758d}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.hidden{display:none}.login{max-width:420px;margin:12vh auto}.err{color:#a52d2d;background:#ffe9e9;padding:10px;border-radius:8px}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><b>UniHealth HIS</b><span id="who">Not signed in</span></header><main class="wrap"><section id="login" class="card login"><h2>Sign in</h2><p>Use your Platform Owner credentials to sign in.</p><div class="form"><div class="full"><label>Username</label><input id="user" type="email" autocomplete="username" placeholder="Email or username"></div><div class="full"><label>Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="Password"></div></div><br><button onclick="login()">Sign in</button><div id="le"></div></section><section id="app" class="hidden"><div class="nav"><button onclick="dash()">Dashboard</button><button onclick="reception()">Reception</button><button onclick="queue()">Consultation Queue</button><button onclick="patients()">Patients</button><button onclick="pharmacy()">Pharmacy</button><button onclick="staff()">Staff</button><button onclick="audit()">Audit</button><button id="ownerNav" class="hidden" onclick="owner()">Owner Control</button><button class="alt" onclick="logout()">Sign out</button></div><div id="view"></div></section></main><script>
let token=localStorage.token,user=JSON.parse(localStorage.user||'null');const V=()=>document.getElementById('view');async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function owner(){if(!user||user.role!=='platform_owner')return;let a=await api('/api/owner/institutions');V().innerHTML='<div class="panel"><h2>Platform Owner — Institution Approval</h2><p>Approve or suspend institutions, issue Admin IDs and control platform access.</p><table><tr><th>Institution</th><th>Type</th><th>Status</th><th>Subscription</th><th>Admin ID</th><th>Action</th></tr>'+a.map(x=>'<tr><td>'+x.name+'</td><td>'+x.type+'</td><td>'+x.status+'</td><td>'+x.subscription+'</td><td>'+x.admin_id+'</td><td>'+(x.status==='active'?'<button class="alt" onclick="suspendInst('+x.id+')">Suspend</button>':'<button onclick="approveInst('+x.id+')">Approve</button>')+'</td></tr>').join('')+'</table></div><div class="panel"><h3>Register institution</h3><div class="form"><input id="oname" placeholder="Institution name"><select id="otype"><option>University</option><option>College</option></select></div><br><button onclick="createInst()">Create Institution</button></div>'}
async function approveInst(id){try{await api('/api/owner/institutions/'+id+'/approve',{method:'POST',body:'{}'});owner()}catch(e){alert(e.message)}}
async function suspendInst(id){try{await api('/api/owner/institutions/'+id+'/suspend',{method:'POST',body:'{}'});owner()}catch(e){alert(e.message)}}
async function createInst(){try{await api('/api/owner/institutions',{method:'POST',body:JSON.stringify({name:oname.value,type:otype.value})});owner()}catch(e){alert(e.message)}}
function show(){document.getElementById('login').classList.toggle('hidden',!!token);document.getElementById('app').classList.toggle('hidden',!token);document.getElementById('who').textContent=user?user.username+' • '+user.role:'';document.getElementById('ownerNav').classList.toggle('hidden',!(user&&user.role==='platform_owner'));if(token)dash()}async function login(){try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});let d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;user=d.user;localStorage.token=token;localStorage.user=JSON.stringify(user);show()}catch(e){document.getElementById('le').innerHTML='<p class="err">'+e.message+'</p>'}}function logout(){localStorage.clear();token=null;user=null;show()}async function dash(){let d=await api('/api/dashboard');V().innerHTML='<h2>Dashboard</h2><div class="grid">'+[['Students',d.students],['Staff patients',d.staffPatients],['Waiting',d.waiting],['Low stock',d.lowStock]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="panel"><b>'+d.institution.name+'</b> • '+d.institution.type+' • '+d.institution.subscription+' • '+(d.institution.first_payment?'Payment verified':'Payment pending')+'</div>'}async function reception(){V().innerHTML='<div class="panel"><h2>Receive Patient</h2><div class="form"><div><label>Patient type</label><select id="kind"><option>Student</option><option>Staff</option></select></div><div><label>ID</label><input id="identifier"></div><div><label>Full name</label><input id="name"></div><div><label>Date of birth</label><input id="dob" type="date"></div><div><label>Sex</label><select id="sex"><option></option><option>Female</option><option>Male</option><option>Other</option></select></div><div><label>Phone</label><input id="phone"></div><div><label>Department</label><input id="department"></div><div><label>Insurance/cover</label><select id="cover"><option>Paid / Active</option><option>Not paid / Inactive</option><option>Not covered</option></select></div><div><label>Cover number</label><input id="coverNo"></div><div class="full"><label>Allergies/history</label><textarea id="history"></textarea></div></div><br><button onclick="receive()">Receive</button></div>'}async function receive(){try{await api('/api/patients',{method:'POST',body:JSON.stringify({kind:kind.value,identifier:identifier.value,name:name.value,dob:dob.value,sex:sex.value,phone:phone.value,department:department.value,cover_status:cover.value,cover_number:coverNo.value,history:history.value})});alert('Patient received');queue()}catch(e){alert(e.message)}}async function queue(){let a=await api('/api/queue');V().innerHTML='<div class="panel"><h2>Consultation Queue</h2>'+(a.length?a.map(p=>'<div class="card"><b>'+p.name+'</b><br>'+p.kind+' ID: '+p.identifier+' • Cover: '+p.cover_status+'<br><br><button onclick="consult('+p.id+')">Start consultation</button></div>').join(''):'<p>No patients waiting.</p>')+'</div>'}async function consult(id){let meds=await api('/api/medicines');V().innerHTML='<div class="panel"><h2>New Consultation</h2><div class="form"><div><label>Patient ID</label><input id="pid" value="'+id+'" readonly></div><div><label>Date</label><input id="vd" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="full"><label>Chief complaint</label><textarea id="cc"></textarea></div><div class="full"><label>Vital signs</label><input id="vs"></div><div class="full"><label>Diagnosis</label><textarea id="dx"></textarea></div><div class="full"><label>Treatment/plan</label><textarea id="plan"></textarea></div><div><label>Medicine</label><select id="med"><option value="">None</option>'+meds.filter(m=>m.qty>0).map(m=>'<option value="'+m.id+'">'+m.name+' (stock '+m.qty+')</option>').join('')+'</select></div><div><label>Quantity</label><input id="qty" type="number" min="0" value="0"></div><div class="full"><label>Directions</label><input id="dir"></div></div><br><button onclick="saveConsult()">Save consultation</button></div>'}async function saveConsult(){try{await api('/api/consultations',{method:'POST',body:JSON.stringify({patient_id:+pid.value,visit_date:vd.value,complaint:cc.value,vitals:vs.value,diagnosis:dx.value,plan:plan.value,medicine_id:med.value?+med.value:null,qty:+qty.value,directions:dir.value})});alert('Consultation saved and stock updated');patients()}catch(e){alert(e.message)}}async function patients(){let a=await api('/api/patients');V().innerHTML='<div class="panel"><h2>Patients</h2><table><tr><th>Type</th><th>ID</th><th>Name</th><th>Cover</th><th>Status</th><th></th></tr>'+a.map(p=>'<tr><td>'+p.kind+'</td><td>'+p.identifier+'</td><td>'+p.name+'</td><td>'+p.cover_status+'</td><td>'+p.status+'</td><td><button onclick="viewPatient('+p.id+')">View</button></td></tr>').join('')+'</table></div>'}async function viewPatient(id){let d=await api('/api/patients/'+id);V().innerHTML='<div class="panel"><h2>'+d.patient.name+'</h2><p>'+d.patient.kind+' ID: '+d.patient.identifier+' • Cover: '+d.patient.cover_status+'</p><h3>Consultations</h3><table><tr><th>Date</th><th>Provider</th><th>Diagnosis</th><th>Prescription</th></tr>'+d.consultations.map(c=>'<tr><td>'+c.visit_date+'</td><td>'+c.provider+'</td><td>'+c.diagnosis+'</td><td>'+((c.medicine||'None')+(c.qty?' × '+c.qty:''))+'</td></tr>').join('')+'</table></div>'}async function pharmacy(){let a=await api('/api/medicines');V().innerHTML='<div class="panel"><h2>Pharmacy & Inventory</h2><div class="form"><input id="mn" placeholder="Medicine name"><input id="mb" placeholder="Batch"><input id="mq" type="number" placeholder="Quantity"><input id="mr" type="number" placeholder="Reorder level"><input id="me" type="date"></div><br><button onclick="addMed()">Add medicine</button></div><div class="panel"><table><tr><th>Medicine</th><th>Batch</th><th>Stock</th><th>Reorder</th><th>Expiry</th></tr>'+a.map(m=>'<tr><td>'+m.name+'</td><td>'+m.batch+'</td><td>'+m.qty+'</td><td>'+m.reorder+'</td><td>'+m.expiry+'</td></tr>').join('')+'</table></div>'}async function addMed(){try{await api('/api/medicines',{method:'POST',body:JSON.stringify({name:mn.value,batch:mb.value,qty:+mq.value,reorder:+mr.value,expiry:me.value})});pharmacy()}catch(e){alert(e.message)}}async function staff(){if(user.role!=='institution_admin')return V().innerHTML='<div class="panel">Only the Institution Admin can register staff.</div>';let a=await api('/api/staff');V().innerHTML='<div class="panel"><h2>Register Staff</h2><div class="form"><input id="su" placeholder="Username"><input id="sp" placeholder="Temporary password"><input id="sr" placeholder="Role e.g. nurse"><input id="sid" placeholder="Staff ID"></div><br><button onclick="addStaff()">Register</button></div><div class="panel"><table><tr><th>Username</th><th>Role</th><th>Staff ID</th></tr>'+a.map(s=>'<tr><td>'+s.username+'</td><td>'+s.role+'</td><td>'+s.staff_id+'</td></tr>').join('')+'</table></div>'}async function addStaff(){try{await api('/api/staff',{method:'POST',body:JSON.stringify({username:su.value,password:sp.value,role:sr.value,staff_id:sid.value})});staff()}catch(e){alert(e.message)}}async function audit(){let a=await api('/api/audit');V().innerHTML='<div class="panel"><h2>Audit Log</h2><table><tr><th>Time</th><th>Action</th><th>Entity</th><th>ID</th></tr>'+a.map(x=>'<tr><td>'+x.created_at+'</td><td>'+x.action+'</td><td>'+x.entity+'</td><td>'+x.entity_id+'</td></tr>').join('')+'</table></div>'}show();
</script></body></html>
